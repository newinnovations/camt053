[package]
name = "camt053"
version = "0.1.0"
edition = "2024"
description = "CAMT.053 (ISO 20022) bank statement parser and MT940 converter"
authors = ["Martin van der Werff <github@newinnovations.nl>"]
license = "MIT"
repository = "https://github.com/newinnovations/camt053"
readme = "README.md"
keywords = ["camt053", "mt940", "iso20022", "banking", "parser"]
categories = ["parser-implementations", "finance", "command-line-utilities"]
exclude = ["doc/"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
zip = "8.6"
